name: SG-01 draft qualification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (no cache, no artifacts)
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Content, domain tests, TypeScript, production build
        run: npm run check
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Chromium desktop and mobile workflows
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/sprachgefuehl-vite.log 2>&1 &
          npm run test:browser

  cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Qualify source and build
        run: npm run check
      - name: Install genuine Firefox and WebKit engines
        run: npx playwright install --with-deps firefox webkit
      - name: Firefox and WebKit desktop/mobile storage and learning smoke
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/sprachgefuehl-crossbrowser.log 2>&1 &
          npm run test:cross-browser

  offline-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Build exact-HEAD stamped offline shell
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Real Chromium cache-upgrade and offline recovery regression
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/sprachgefuehl-m40-offline.log 2>&1 &
          npm run test:offline-upgrade

  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Build exact-HEAD app and stamped SW
        run: npm run build
      - name: Install real Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run genuine two-bundle worker upgrade and rollback test
        run: npm run test:rollback
