name: SG-01 draft qualification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (no cache, no artifacts)
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Content, domain tests, TypeScript, production build
        run: npm run check
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Chromium desktop and mobile workflows
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/sprachgefuehl-vite.log 2>&1 &
          npm run test:browser
